# Publishes skills/rivet-open-orange to https://github.com/rivet-dev/skills,
# where the Rivet MCP server (rivet-dev/engine-ee platform/mcp) bundles every
# skills/rivet-* directory into its next release.
#
# This repository owns only skills/rivet-open-orange in rivet-dev/skills. The
# website and rivet-dev/agents publish the other directories.
#
#   gh workflow run sync-skill.yml --repo rivet-dev/open-orange

name: Sync skill

on:
  push:
    branches: [main]
    paths:
      - skills/rivet-open-orange/**
      - .github/workflows/sync-skill.yml
  workflow_dispatch:

concurrency:
  group: sync-skill
  cancel-in-progress: false

jobs:
  sync:
    # The skill links to this repository. Publish it only after the repository
    # is public, so Rivet MCP users never get links that answer 404. Publish only
    # the reviewed skill on main of this repository, also from a manual run, and
    # never from a fork or another branch.
    if: ${{ !github.event.repository.private && github.repository == 'rivet-dev/open-orange' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The MCP bundler refuses the whole release over one bad skill, so check
      # its rules here: the name, the description, and UTF-8 text files.
      - name: Check the skill
        run: |
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          const dir = "skills/rivet-open-orange";
          const fail = (message) => { console.error(`::error::${message}`); process.exit(1); };
          const files = readdirSync(dir, { recursive: true, withFileTypes: true }).filter((entry) => entry.isFile());
          for (const file of files) {
            const raw = readFileSync(join(file.parentPath, file.name));
            if (!Buffer.from(raw.toString("utf8"), "utf8").equals(raw)) fail(`${file.name} is not UTF-8 text`);
          }
          const frontmatter = /^---\n([\s\S]*?)\n---\n/.exec(readFileSync(join(dir, "SKILL.md"), "utf8"))?.[1];
          if (frontmatter === undefined) fail("SKILL.md must begin with YAML frontmatter");
          const value = (key) => new RegExp(`^${key}:\\s+(.*)$`, "m").exec(frontmatter)?.[1].trim();
          if (value("name") !== "rivet-open-orange") fail("SKILL.md must declare `name: rivet-open-orange`");
          const description = value("description") ?? "";
          if (description.length < 1 || description.length > 1024) fail("description must be 1 to 1024 characters");
          console.log(`skill ok: ${files.length} files`);
          JS

      - name: Check the token
        env:
          GH_TOKEN: ${{ secrets.RIVET_GITHUB_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::RIVET_GITHUB_PAT secret is not set"
            exit 1
          fi
          if ! gh api repos/rivet-dev/skills --silent; then
            echo "::error::RIVET_GITHUB_PAT is invalid or expired, or cannot read rivet-dev/skills"
            exit 1
          fi

      - name: Check out the skills repo
        uses: actions/checkout@v4
        with:
          repository: rivet-dev/skills
          token: ${{ secrets.RIVET_GITHUB_PAT }}
          path: skills-repo

      - name: Replace the skill
        run: |
          set -euo pipefail
          rm -rf skills-repo/skills/rivet-open-orange
          mkdir -p skills-repo/skills
          cp -R skills/rivet-open-orange skills-repo/skills/rivet-open-orange

      - name: Commit and push
        working-directory: skills-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/rivet-open-orange
          if git diff --staged --quiet; then
            echo "No skill changes to publish"
          else
            git commit -m "chore: update rivet-open-orange skill from rivet-dev/open-orange@${{ github.sha }}"
            # rivet-dev/website and rivet-dev/agents push to the same branch.
            for attempt in 1 2 3; do
              if git push; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then break; fi
              sleep $((attempt * 5))
              git pull --rebase
            done
            echo "::error::could not push to rivet-dev/skills after 3 attempts"
            exit 1
          fi
