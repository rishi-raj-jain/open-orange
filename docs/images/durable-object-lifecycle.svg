<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="An object with one accepted WebSocket. 1: a request starts the Rivet Actor and the object instance, which accepts a socket. 2: after 10 seconds with no event, Orange drops the instance; the actor and the socket stay. 3: a message on the socket builds a new instance. 4: the socket closes. 5: after 10 more idle seconds, the actor sleeps. 6: the next request wakes the actor with a new instance.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;font-size:13px;fill:#1B1916}
.soft{fill:#56524A}.faint{fill:#8A8478}.hl{fill:#B74B23}.b{font-weight:600}.n{font-size:12px;font-weight:600}
</style>
<g stroke="#1B1916" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="4 5">
<line x1="200" y1="60" x2="200" y2="236"/>
<line x1="330" y1="60" x2="330" y2="236"/>
<line x1="440" y1="60" x2="440" y2="236"/>
<line x1="570" y1="60" x2="570" y2="236"/>
<line x1="690" y1="60" x2="690" y2="236"/>
<line x1="780" y1="60" x2="780" y2="236"/>
</g>
<circle cx="200" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="200" y="44.5" text-anchor="middle">1</text>
<circle cx="330" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="330" y="44.5" text-anchor="middle">2</text>
<circle cx="440" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="440" y="44.5" text-anchor="middle">3</text>
<circle cx="570" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="570" y="44.5" text-anchor="middle">4</text>
<circle cx="690" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="690" y="44.5" text-anchor="middle">5</text>
<circle cx="780" cy="40" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s n soft" x="780" y="44.5" text-anchor="middle">6</text>
<text class="s b" x="20" y="101">Rivet Actor</text>
<text class="s b" x="20" y="161">Object instance</text>
<text class="s b" x="20" y="221">Accepted socket</text>
<g stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
<line x1="690" y1="96" x2="780" y2="96"/>
<line x1="330" y1="156" x2="440" y2="156"/>
<line x1="690" y1="156" x2="780" y2="156"/>
</g>
<rect x="200" y="89" width="490" height="14" rx="7" fill="#B74B23"/>
<rect x="780" y="89" width="40" height="14" rx="7" fill="#B74B23"/>
<rect x="200" y="149" width="130" height="14" rx="7" fill="#56524A" fill-opacity=".55"/>
<rect x="440" y="149" width="250" height="14" rx="7" fill="#56524A" fill-opacity=".55"/>
<rect x="780" y="149" width="40" height="14" rx="7" fill="#56524A" fill-opacity=".55"/>
<rect x="200" y="211" width="370" height="10" rx="5" fill="none" stroke="#56524A" stroke-width="1.5"/>
<text class="s faint" x="385.0" y="180" text-anchor="middle">dropped</text>
<text class="s faint" x="735.0" y="120" text-anchor="middle">asleep</text>
<line x1="20" y1="256" x2="820" y2="256" stroke="#1B1916" stroke-opacity=".10" stroke-width="1"/>
<text class="s n soft" x="20" y="286">1</text>
<text class="s" x="38" y="286">Request: the actor starts, and the</text>
<text class="s" x="38" y="302">instance accepts a socket</text>
<text class="s n soft" x="20" y="326">2</text>
<text class="s hl" x="38" y="326">10 s with no event: the instance is</text>
<text class="s hl" x="38" y="342">dropped. The socket stays open</text>
<text class="s n soft" x="20" y="366">3</text>
<text class="s" x="38" y="366">Message on the socket: a new</text>
<text class="s" x="38" y="382">instance, with the socket restored</text>
<text class="s n soft" x="430" y="286">4</text>
<text class="s" x="448" y="286">The socket closes</text>
<text class="s n soft" x="430" y="326">5</text>
<text class="s hl" x="448" y="326">10 s with no event: the actor sleeps</text>
<text class="s n soft" x="430" y="366">6</text>
<text class="s" x="448" y="366">Request: the actor wakes, with a</text>
<text class="s" x="448" y="382">new instance</text>
</svg>
