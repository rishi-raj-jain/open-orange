<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="One Durable Object moves: it starts on Open Orange on its first request or when backfill wakes it, copies its data from Cloudflare in pages, Cloudflare marks it moved if no write came during the copy, and Cloudflare then answers 503 migrator.moved. Roll back with MIGRATOR_DISABLED=true.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;fill:#56524A}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;fill:#56524A}
.i{fill:#1B1916}
.f{fill:#8A8478}
.o{fill:#B74B23}
.b{font-weight:600}
</style>
<rect x=".5" y=".5" width="639" height="419" rx="16" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".10"/>
<rect x="20" y="20" width="270" height="320" rx="18" fill="#1B1916" fill-opacity=".04"/>
<text class="s f b" x="36" y="42" font-size="12" text-anchor="start">Cloudflare</text>
<rect x="350" y="20" width="270" height="320" rx="18" fill="#B74B23" fill-opacity=".08"/>
<text class="s o b" x="366" y="42" font-size="12" text-anchor="start">Open Orange on Rivet</text>
<rect x="366" y="52" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="380" y="76" font-size="12" text-anchor="start">1</text>
<text class="s i b" x="398" y="76" font-size="14" text-anchor="start">Object starts</text>
<text class="s" x="380" y="95" font-size="12" text-anchor="start">first request, or backfill wakes it</text>
<rect x="36" y="52" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="s i b" x="50" y="76" font-size="14" text-anchor="start">Durable Object</text>
<text class="s" x="50" y="95" font-size="12" text-anchor="start">serves requests during the copy</text>
<rect x="36" y="124" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="s i b" x="50" y="148" font-size="14" text-anchor="start">Sends its data</text>
<text class="s" x="50" y="167" font-size="12" text-anchor="start">in pages, when Orange asks</text>
<rect x="366" y="124" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="380" y="148" font-size="12" text-anchor="start">2</text>
<text class="s i b" x="398" y="148" font-size="14" text-anchor="start">Copies the data</text>
<text class="s" x="380" y="167" font-size="12" text-anchor="start">before the constructor runs</text>
<rect x="36" y="196" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="50" y="220" font-size="12" text-anchor="start">3</text>
<text class="s i b" x="68" y="220" font-size="14" text-anchor="start">Marks it moved</text>
<text class="s" x="50" y="239" font-size="12" text-anchor="start">if no write came during the copy</text>
<rect x="36" y="268" width="238" height="56" rx="12" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="s i b" x="50" y="292" font-size="14" text-anchor="start">Answers 503</text>
<text class="m" x="50" y="311" font-size="12" text-anchor="start">migrator.moved</text>
<rect x="366" y="268" width="238" height="56" rx="12" fill="#B74B23" fill-opacity=".12" stroke="#B74B23" stroke-width="1.5"/>
<text class="m o b" x="380" y="292" font-size="12" text-anchor="start">4</text>
<text class="s i b" x="398" y="292" font-size="14" text-anchor="start">Serves the object</text>
<text class="s" x="380" y="311" font-size="12" text-anchor="start">every request runs here</text>
<path d="M485 108L485 122" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M481.0 116.2L485 122L489.0 116.2" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M485 180L485 266" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M481.0 260.2L485 266L489.0 260.2" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M155 108L155 122" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M151.0 116.2L155 122L159.0 116.2" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M155 180L155 194" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M151.0 188.2L155 194L159.0 188.2" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M155 252L155 266" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M151.0 260.2L155 266L159.0 260.2" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M276 152L362 152" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M356.2 156.0L362 152L356.2 148.0" fill="none" stroke="#1B1916" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="298" cy="152" r="3.5" fill="#B74B23"/>
<circle cx="316" cy="152" r="3.5" fill="#B74B23"/>
<circle cx="334" cy="152" r="3.5" fill="#B74B23"/>
<text class="s f" x="319" y="140" font-size="12" text-anchor="middle">pages</text>
<rect x="20" y="356" width="600" height="44" rx="14" fill="#1B1916" fill-opacity=".04" stroke="#1B1916" stroke-opacity=".14" stroke-width="1"/>
<text class="s" x="36" y="383" font-size="13" text-anchor="start">Roll back: point DNS back, then set</text>
<text class="m i" x="604" y="383" font-size="13" text-anchor="end">MIGRATOR_DISABLED=true</text>
</svg>
