<svg xmlns="http://www.w3.org/2000/svg" width="600" height="296" viewBox="0 0 600 296" role="img" aria-label="Prepare the Cloudflare Worker, deploy to Open Orange, point DNS at it, then run the backfill">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#E6EDF3}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E6EDF3}
.mu{fill:#9DA7B3}
.o{fill:#FFA45C}
.g{fill:#6FD597}
.b{font-weight:600}
.cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.12em}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6EDF3"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6E7681"/></marker>
</defs>
<rect x="20" y="66" width="160" height="44" rx="8" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/><text class="m" x="36" y="93" font-size="14" text-anchor="start">app.example.com</text>
<rect x="400" y="20" width="180" height="52" rx="8" fill="#3B2412" stroke="#F38020" stroke-width="1.5"/><text class="s b" x="416" y="51" font-size="15" text-anchor="start">Cloudflare</text>
<rect x="400" y="104" width="180" height="52" rx="8" fill="#10301E" stroke="#3FB96B" stroke-width="1.5"/><text class="s b" x="416" y="135" font-size="15" text-anchor="start">Open Orange</text>
<path d="M180 80 C 290 80, 300 46, 394 46" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#af)"/>
<text class="s mu" x="288" y="53" font-size="13" text-anchor="middle">before</text>
<path d="M180 96 C 290 96, 300 130, 394 130" fill="none" stroke="#E6EDF3" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s b" x="288" y="133" font-size="13" text-anchor="middle">after</text>
<line x1="40" y1="204" x2="560" y2="204" stroke="#6E7681" stroke-width="1.5"/>
<circle cx="80" cy="204" r="13" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="80" y="209" font-size="13" text-anchor="middle">1</text>
<text class="s" x="80" y="240" font-size="14" text-anchor="middle">Prepare</text>
<circle cx="227" cy="204" r="13" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="227" y="209" font-size="13" text-anchor="middle">2</text>
<text class="s" x="227" y="240" font-size="14" text-anchor="middle">Deploy</text>
<circle cx="373" cy="204" r="13" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="373" y="209" font-size="13" text-anchor="middle">3</text>
<text class="s" x="373" y="240" font-size="14" text-anchor="middle">Point DNS</text>
<circle cx="520" cy="204" r="13" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="520" y="209" font-size="13" text-anchor="middle">4</text>
<text class="s" x="520" y="240" font-size="14" text-anchor="middle">Backfill</text>
<rect x="20" y="266" width="14" height="14" rx="3" fill="#3B2412" stroke="#F38020" stroke-width="1.5"/>
