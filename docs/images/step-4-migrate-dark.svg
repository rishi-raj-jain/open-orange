<rect x="141" y="266" width="14" height="14" rx="3" fill="#10301E" stroke="#3FB96B" stroke-width="1.5"/>
<text class="s mu" x="163" y="278" font-size="14" text-anchor="start">Open Orange on Rivet</text>
