<svg xmlns="http://www.w3.org/2000/svg" width="800" height="352" viewBox="0 0 800 352" role="img" aria-label="A first request or a backfill wake starts the object on Orange. Orange asks Cloudflare for the export and gets pages of about 4 MB. When no request is in flight, the object on Cloudflare marks itself moved. Then the object serves on Orange, and Cloudflare answers 503 migrator.moved.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;font-size:13px;fill:#1B1916}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.soft{fill:#56524A}
.faint{fill:#8A8478}
.hl{fill:#B74B23}
.b{font-weight:600}
</style>
<g stroke="#1B1916" stroke-opacity=".14" stroke-width="1.5" stroke-dasharray="4 5">
<line x1="110" y1="64" x2="110" y2="300"/>
<line x1="400" y1="64" x2="400" y2="300"/>
<line x1="690" y1="64" x2="690" y2="200"/>
<line x1="690" y1="254" x2="690" y2="300"/>
</g>
<g fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5">
<rect x="20" y="20" width="180" height="44" rx="12"/>
<rect x="310" y="20" width="180" height="44" rx="12"/>
<rect x="600" y="20" width="180" height="44" rx="12"/>
</g>
<text class="s b" x="110" y="47" text-anchor="middle">Client or backfill</text>
<text class="s b" x="400" y="47" text-anchor="middle">Object on Orange</text>
<text class="s b" x="690" y="47" text-anchor="middle">Object on Cloudflare</text>
<g fill="none" stroke="#56524A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M114 104H394M388 99l6 5-6 5"/>
<path d="M404 144H684M678 139l6 5-6 5"/>
<path d="M686 184H406M412 179l-6 5 6 5"/>
<path d="M396 282H116M122 277l-6 5 6 5"/>
</g>
<text class="s" x="255" y="95" text-anchor="middle"><tspan class="faint">1</tspan><tspan dx="6">First request or wake</tspan></text>
<text class="s" x="545" y="135" text-anchor="middle"><tspan class="faint">2</tspan><tspan dx="6">Asks for the export</tspan></text>
<text class="s" x="545" y="175" text-anchor="middle"><tspan class="faint">3</tspan><tspan dx="6">Pages of about 4 MB</tspan></text>
<rect x="595" y="202" width="190" height="50" rx="12" fill="#B74B23" fill-opacity=".12" stroke="#B74B23" stroke-width="1.5"/>
<text class="s b hl" x="690" y="223" text-anchor="middle">4 No request in flight:</text>
<text class="s b hl" x="690" y="241" text-anchor="middle">marks itself moved</text>
<text class="s" x="255" y="273" text-anchor="middle"><tspan class="faint">5</tspan><tspan dx="6">Constructor runs, then it serves</tspan></text>
<rect x="550" y="302" width="235" height="34" rx="12" fill="none" stroke="#1B1916" stroke-opacity=".22" stroke-width="1.5"/>
<text class="s soft" x="667.5" y="324" text-anchor="middle">After that: 503 <tspan class="m">migrator.moved</tspan></text>
</svg>
