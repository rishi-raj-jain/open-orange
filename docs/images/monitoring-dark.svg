<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" role="img" aria-label="Inside orange serve, your Worker calls your Durable Objects, which run as Rivet Actors. RivetKit sends their traces over OTLP to a collector such as Jaeger, Tempo, or Honeycomb, and Prometheus scrapes the runner's metrics endpoint.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#E6EDF3}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#E6EDF3}
.mu{fill:#9DA7B3}
.b{font-weight:600}
.cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.12em}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E6EDF3"/></marker>
</defs>
<rect x="20" y="20" width="368" height="188" rx="10" fill="none" stroke="#6E7681" stroke-width="1.5" stroke-dasharray="7 6"/>
<text class="cap mu" x="36" y="45" font-size="12" text-anchor="start">ORANGE SERVE</text>
<rect x="36" y="60" width="136" height="64" rx="8" fill="#3B2412" stroke="#F38020" stroke-width="1.5"/>
<text class="s b" x="52" y="87" font-size="15" text-anchor="start">Your Worker</text>
<text class="m mu" x="52" y="108" font-size="13" text-anchor="start">fetch()</text>
<rect x="204" y="60" width="168" height="64" rx="8" fill="#3B2412" stroke="#F38020" stroke-width="1.5"/>
<text class="s b" x="220" y="87" font-size="15" text-anchor="start">Durable Objects</text>
<text class="m mu" x="220" y="108" font-size="13" text-anchor="start">Rivet Actors</text>
<path d="M172 92 H198" fill="none" stroke="#E6EDF3" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="204" y="136" width="168" height="56" rx="8" fill="#10301E" stroke="#3FB96B" stroke-width="1.5"/>
<text class="s b" x="220" y="160" font-size="15" text-anchor="start">Metrics</text>
<text class="m mu" x="220" y="180" font-size="13" text-anchor="start">/metrics</text>
<rect x="510" y="52" width="190" height="80" rx="8" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="526" y="80" font-size="15" text-anchor="start">OTLP collector</text>
<text class="s mu" x="526" y="101" font-size="13" text-anchor="start">Jaeger, Tempo,</text>
<text class="s mu" x="526" y="119" font-size="13" text-anchor="start">Honeycomb</text>
<path d="M372 92 H504" fill="none" stroke="#E6EDF3" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s mu" x="449" y="82" font-size="13" text-anchor="middle">OTLP traces</text>
<rect x="510" y="140" width="190" height="48" rx="8" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s b" x="526" y="169" font-size="15" text-anchor="start">Prometheus</text>
<path d="M510 164 H378" fill="none" stroke="#E6EDF3" stroke-width="1.5" marker-end="url(#a)"/>
<text class="s mu" x="449" y="154" font-size="13" text-anchor="middle">scrapes</text>
<rect x="20" y="230" width="14" height="14" rx="3" fill="#3B2412" stroke="#F38020" stroke-width="1.5"/>
<text class="s mu" x="42" y="242" font-size="14" text-anchor="start">Your code</text>
<rect x="132" y="230" width="14" height="14" rx="3" fill="#10301E" stroke="#3FB96B" stroke-width="1.5"/>
<text class="s mu" x="154" y="242" font-size="14" text-anchor="start">Rivet</text>
<rect x="212" y="230" width="14" height="14" rx="3" fill="#161B22" stroke="#E6EDF3" stroke-width="1.5"/>
<text class="s mu" x="234" y="242" font-size="14" text-anchor="start">Your monitoring tools</text>
</svg>
