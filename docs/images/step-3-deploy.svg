<svg xmlns="http://www.w3.org/2000/svg" width="600" height="266" viewBox="0 0 600 266" role="img" aria-label="orange deploy builds an image of your Worker, uploads it, and rolls a runner pool out to it on a Rivet cluster">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:#1B1916}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1B1916}
.mu{fill:#56524A}
.o{fill:#C25E0E}
.g{fill:#17803F}
.b{font-weight:600}
.cap{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.12em}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1B1916"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8578"/></marker>
</defs>
<rect x="20" y="86" width="140" height="64" rx="8" fill="#FEF0E4" stroke="#F38020" stroke-width="1.5"/>
<text class="s b" x="36" y="113" font-size="15" text-anchor="start">Your Worker</text>
<text class="m mu" x="36" y="134" font-size="13" text-anchor="start">wrangler.jsonc</text>
<rect x="196" y="20" width="208" height="196" rx="8" fill="#E7F6EC" stroke="#22A355" stroke-width="1.5"/>
<text class="cap g" x="212" y="45">ORANGE DEPLOY</text>
<rect x="212" y="60" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<circle cx="234" cy="82" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<text class="s b" x="234" y="86.5" font-size="13" text-anchor="middle">1</text>
<text class="s" x="254" y="87.5" font-size="15" text-anchor="start">Build image</text>
<rect x="212" y="112" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<circle cx="234" cy="134" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<text class="s b" x="234" y="138.5" font-size="13" text-anchor="middle">2</text>
<text class="s" x="254" y="139.5" font-size="15" text-anchor="start">Upload</text>
<rect x="212" y="164" width="176" height="44" rx="8" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<circle cx="234" cy="186" r="11" fill="#FFFFFF" stroke="#1B1916" stroke-width="1.5"/>
<text class="s b" x="234" y="190.5" font-size="13" text-anchor="middle">3</text>
<text class="s" x="254" y="191.5" font-size="15" text-anchor="start">Roll out pool</text>
<path d="M160 118 H190" fill="none" stroke="#1B1916" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="440" y="82" width="140" height="72" rx="8" fill="#E7F6EC" stroke="#22A355" stroke-width="1.5"/>
<text class="s b" x="456" y="111" font-size="15" text-anchor="start">Rivet cluster</text>
<text class="m mu" x="456" y="133" font-size="13" text-anchor="start">orange serve</text>
<path d="M404 118 H434" fill="none" stroke="#1B1916" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="236" width="14" height="14" rx="3" fill="#FEF0E4" stroke="#F38020" stroke-width="1.5"/>
<text class="s mu" x="42" y="248" font-size="14" text-anchor="start">Your Worker, not changed</text>
<rect x="243.2" y="236" width="14" height="14" rx="3" fill="#E7F6EC" stroke="#22A355" stroke-width="1.5"/>
<text class="s mu" x="265.2" y="248" font-size="14" text-anchor="start">Open Orange on Rivet</text>
</svg>
