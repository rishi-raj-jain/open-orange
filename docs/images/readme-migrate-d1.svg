<svg xmlns="http://www.w3.org/2000/svg" width="640" height="284" viewBox="0 0 640 284" role="img" aria-label="A D1 database moves in six steps: freeze writes, export, import, check every row, switch, and then Cloudflare forwards every query to Open Orange. Writes fail with a clear error until the switch. Reads fail only during the export.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;fill:#56524A}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;fill:#56524A}
.i{fill:#1B1916}
.f{fill:#8A8478}
.o{fill:#B74B23}
.b{font-weight:600}
</style>
<rect x=".5" y=".5" width="639" height="283" rx="16" fill="#FFFFFF" stroke="#1B1916" stroke-opacity=".10"/>
<text class="m f" x="26" y="44" font-size="12" text-anchor="start">1</text>
<text class="s i b" x="40" y="44" font-size="14" text-anchor="start">Freeze</text>
<text class="s f" x="26" y="64" font-size="11.5" text-anchor="start">Triggers stop</text>
<text class="s f" x="26" y="80" font-size="11.5" text-anchor="start">each write</text>
<text class="m o b" x="124" y="44" font-size="12" text-anchor="start">2</text>
<text class="s o b" x="138" y="44" font-size="14" text-anchor="start">Export</text>
<text class="s f" x="124" y="64" font-size="11.5" text-anchor="start">D1 dumps</text>
<text class="s f" x="124" y="80" font-size="11.5" text-anchor="start">itself exactly</text>
<text class="m f" x="222" y="44" font-size="12" text-anchor="start">3</text>
<text class="s i b" x="236" y="44" font-size="14" text-anchor="start">Import</text>
<text class="s f" x="222" y="64" font-size="11.5" text-anchor="start">1 MiB commits</text>
<text class="s f" x="222" y="80" font-size="11.5" text-anchor="start">that resume</text>
<text class="m f" x="320" y="44" font-size="12" text-anchor="start">4</text>
<text class="s i b" x="334" y="44" font-size="14" text-anchor="start">Check</text>
<text class="s f" x="320" y="64" font-size="11.5" text-anchor="start">Every row</text>
<text class="s f" x="320" y="80" font-size="11.5" text-anchor="start">by SHA-256</text>
<text class="m f" x="418" y="44" font-size="12" text-anchor="start">5</text>
<text class="s i b" x="432" y="44" font-size="14" text-anchor="start">Switch</text>
<text class="s f" x="418" y="64" font-size="11.5" text-anchor="start">Lease still</text>
<text class="s f" x="418" y="80" font-size="11.5" text-anchor="start">holds</text>
<text class="m f" x="516" y="44" font-size="12" text-anchor="start">6</text>
<text class="s i b" x="530" y="44" font-size="14" text-anchor="start">Moved</text>
<text class="s f" x="516" y="64" font-size="11.5" text-anchor="start">Queries go</text>
<text class="s f" x="516" y="80" font-size="11.5" text-anchor="start">to Orange</text>
<path d="M120 100V236" stroke="#1B1916" stroke-opacity=".22" stroke-dasharray="4 5"/>
<path d="M218 100V236" stroke="#1B1916" stroke-opacity=".22" stroke-dasharray="4 5"/>
<path d="M512 100V236" stroke="#1B1916" stroke-opacity=".22" stroke-dasharray="4 5"/>
<text class="s i b" x="26" y="122" font-size="12" text-anchor="start">Writes</text>
<rect x="26" y="132" width="482" height="24" rx="12" fill="#B74B23"/>
<text class="s b" x="267.0" y="148" font-size="12" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">fail with orange-d1-frozen</text>
<rect x="516" y="132" width="88" height="24" rx="12" fill="#B74B23" fill-opacity=".14" stroke="#B74B23" stroke-opacity=".5"/>
<text class="s" x="560.0" y="148" font-size="12" text-anchor="middle">on Orange</text>
<text class="s i b" x="26" y="186" font-size="12" text-anchor="start">Reads</text>
<rect x="26" y="196" width="90" height="24" rx="12" fill="#1B1916" fill-opacity=".10"/>
<text class="s" x="71.0" y="212" font-size="12" text-anchor="middle">Cloudflare</text>
<rect x="124" y="196" width="90" height="24" rx="12" fill="#B74B23"/>
<text class="s b" x="169.0" y="212" font-size="12" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">fail</text>
<rect x="222" y="196" width="286" height="24" rx="12" fill="#1B1916" fill-opacity=".10"/>
<text class="s" x="365.0" y="212" font-size="12" text-anchor="middle">run on Cloudflare D1</text>
<rect x="516" y="196" width="88" height="24" rx="12" fill="#B74B23" fill-opacity=".14" stroke="#B74B23" stroke-opacity=".5"/>
<text class="s" x="560.0" y="212" font-size="12" text-anchor="middle">on Orange</text>
<text class="s f" x="320" y="262" font-size="13" text-anchor="middle">Writes fail with a clear error until the switch. Reads fail only during the export.</text>
</svg>
