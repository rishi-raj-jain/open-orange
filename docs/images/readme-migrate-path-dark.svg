<svg xmlns="http://www.w3.org/2000/svg" width="640" height="276" viewBox="0 0 640 276" role="img" aria-label="The migration path: check with orange doctor, prepare the Worker, deploy it to Cloudflare, deploy to Rivet, move D1, point DNS at Rivet, backfill, then clean up. Traffic moves when you point DNS. Skip step 5 without D1, and step 7 without Durable Objects.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;fill:#D4D4D8}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;fill:#D4D4D8}
.i{fill:#FFFFFF}
.f{fill:#A2A2AA}
.o{fill:#D36945}
.b{font-weight:600}
</style>
<rect x=".5" y=".5" width="639" height="275" rx="16" fill="#0C0C0E" stroke="#FFFFFF" stroke-opacity=".10"/>
<rect x="20" y="24" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="34" y="52" font-size="12" text-anchor="start">1</text>
<text class="s i b" x="50" y="52" font-size="15" text-anchor="start">Check</text>
<text class="m" x="34" y="76" font-size="11.5" text-anchor="start">orange doctor</text>
<text class="s f" x="34" y="98" font-size="12" text-anchor="start">Lists each binding</text>
<path d="M165.5 70.0L171.0 70.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M165.2 74.0L171.0 70.0L165.2 66.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="173" y="24" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="187" y="52" font-size="12" text-anchor="start">2</text>
<text class="s i b" x="203" y="52" font-size="15" text-anchor="start">Prepare</text>
<text class="m" x="187" y="76" font-size="11.5" text-anchor="start">migrate prepare</text>
<text class="s f" x="187" y="98" font-size="12" text-anchor="start">Wraps your Worker</text>
<path d="M318.5 70.0L324.0 70.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M318.2 74.0L324.0 70.0L318.2 66.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="326" y="24" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="340" y="52" font-size="12" text-anchor="start">3</text>
<text class="s i b" x="356" y="52" font-size="15" text-anchor="start">Cloudflare</text>
<text class="m" x="340" y="76" font-size="11.5" text-anchor="start">wrangler deploy</text>
<text class="s f" x="340" y="98" font-size="12" text-anchor="start">No change for users</text>
<path d="M471.5 70.0L477.0 70.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M471.2 74.0L477.0 70.0L471.2 66.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="479" y="24" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="493" y="52" font-size="12" text-anchor="start">4</text>
<text class="s i b" x="509" y="52" font-size="15" text-anchor="start">Rivet</text>
<text class="m" x="493" y="76" font-size="11.5" text-anchor="start">orange deploy</text>
<text class="s f" x="493" y="98" font-size="12" text-anchor="start">No traffic yet</text>
<rect x="20" y="136" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="34" y="164" font-size="12" text-anchor="start">5</text>
<text class="s i b" x="50" y="164" font-size="15" text-anchor="start">Move D1</text>
<text class="m" x="34" y="188" font-size="11.5" text-anchor="start">migrate d1</text>
<text class="s f" x="34" y="210" font-size="12" text-anchor="start">Writes freeze</text>
<path d="M165.5 182.0L171.0 182.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M165.2 186.0L171.0 182.0L165.2 178.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="173" y="136" width="139" height="92" rx="12" fill="#D36945" fill-opacity=".12" stroke="#D36945" stroke-width="1.5"/>
<text class="m o b" x="187" y="164" font-size="12" text-anchor="start">6</text>
<text class="s i b" x="203" y="164" font-size="15" text-anchor="start">Point DNS</text>
<text class="s" x="187" y="188" font-size="11.5" text-anchor="start">your domain</text>
<text class="s o b" x="187" y="210" font-size="12" text-anchor="start">Traffic moves</text>
<path d="M318.5 182.0L324.0 182.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M318.2 186.0L324.0 182.0L318.2 178.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="326" y="136" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="340" y="164" font-size="12" text-anchor="start">7</text>
<text class="s i b" x="356" y="164" font-size="15" text-anchor="start">Backfill</text>
<text class="m" x="340" y="188" font-size="11.5" text-anchor="start">migrate backfill</text>
<text class="s f" x="340" y="210" font-size="12" text-anchor="start">Moves idle objects</text>
<path d="M471.5 182.0L477.0 182.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M471.2 186.0L477.0 182.0L471.2 178.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="479" y="136" width="139" height="92" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m f" x="493" y="164" font-size="12" text-anchor="start">8</text>
<text class="s i b" x="509" y="164" font-size="15" text-anchor="start">Clean up</text>
<text class="m" x="493" y="188" font-size="11.5" text-anchor="start">env unset</text>
<text class="s f" x="493" y="210" font-size="12" text-anchor="start">Removes settings</text>
<text class="s f" x="20" y="252" font-size="12" text-anchor="start">Skip step 5 if you have no D1 database. Skip step 7 if you have no Durable Objects.</text>
</svg>
