<svg xmlns="http://www.w3.org/2000/svg" width="640" height="472" viewBox="0 0 640 472" role="img" aria-label="orange migrate prepare reads your Worker, writes .open-orange/migrate/worker.mjs and wrangler.migrate.jsonc, and prints the wrangler commands that you run. It deploys nothing.">
<style>
.s{font-family:system-ui,-apple-system,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;font-weight:500;fill:#D4D4D8}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:500;fill:#D4D4D8}
.i{fill:#FFFFFF}
.f{fill:#A2A2AA}
.o{fill:#D36945}
.b{font-weight:600}
</style>
<rect x=".5" y=".5" width="639" height="471" rx="16" fill="#0C0C0E" stroke="#FFFFFF" stroke-opacity=".10"/>
<rect x="20" y="20" width="230" height="112" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="s f b" x="36" y="42" font-size="12" text-anchor="start">Your Worker · not changed</text>
<rect x="36" y="54" width="198" height="28" rx="8" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m i" x="48" y="73" font-size="13" text-anchor="start">src/index.ts</text>
<rect x="36" y="88" width="198" height="28" rx="8" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m i" x="48" y="107" font-size="13" text-anchor="start">wrangler.jsonc</text>
<path d="M250 76L322 76" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M316.2 80.0L322 76L316.2 72.0" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s f" x="286" y="66" font-size="12" text-anchor="middle">reads</text>
<rect x="330" y="52" width="290" height="48" rx="14" fill="#D36945" fill-opacity=".12" stroke="#D36945" stroke-width="1.5"/>
<text class="m i b" x="475" y="81" font-size="14" text-anchor="middle">orange migrate prepare</text>
<path d="M475 100L475 148" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M471.0 142.2L475 148L479.0 142.2" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s f" x="487" y="130" font-size="12" text-anchor="start">writes</text>
<rect x="20" y="156" width="600" height="168" rx="18" fill="#FFFFFF" fill-opacity=".04"/>
<text class="s f b" x="36" y="178" font-size="12" text-anchor="start">Generated · do not commit</text>
<rect x="36" y="190" width="344" height="118" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m i" x="50" y="213" font-size="13" text-anchor="start">.open-orange/migrate/worker.mjs</text>
<path d="M50 225H366" stroke="#FFFFFF" stroke-opacity=".10"/>
<text class="s" x="50" y="240" font-size="12.5" text-anchor="start">Each SQLite Durable Object class</text>
<text class="m i" x="366" y="240" font-size="12" text-anchor="end">migratable()</text>
<path d="M50 249H366" stroke="#FFFFFF" stroke-opacity=".10"/>
<text class="s" x="50" y="264" font-size="12.5" text-anchor="start">Each D1 binding</text>
<text class="m i" x="366" y="264" font-size="12" text-anchor="end">withFencedD1()</text>
<path d="M50 273H366" stroke="#FFFFFF" stroke-opacity=".10"/>
<text class="s" x="50" y="288" font-size="12.5" text-anchor="start">In front of fetch</text>
<text class="m i" x="366" y="288" font-size="12" text-anchor="end">/__migrate/*</text>
<rect x="392" y="190" width="212" height="118" rx="12" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="m i" x="406" y="213" font-size="13" text-anchor="start">wrangler.migrate.jsonc</text>
<path d="M406 225H590" stroke="#FFFFFF" stroke-opacity=".10"/>
<text class="s" x="406" y="240" font-size="12.5" text-anchor="start">Your config, with main</text>
<text class="s" x="406" y="258" font-size="12.5" text-anchor="start">set to worker.mjs</text>
<path d="M320 324L320 352" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5"/>
<path d="M316.0 346.2L320 352L324.0 346.2" fill="none" stroke="#FFFFFF" stroke-opacity=".34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="s f" x="332" y="343" font-size="12" text-anchor="start">prints</text>
<rect x="20" y="360" width="600" height="92" rx="14" fill="#FFFFFF" fill-opacity=".04" stroke="#FFFFFF" stroke-opacity=".14" stroke-width="1"/>
<text class="s f b" x="36" y="383" font-size="12" text-anchor="start">You run these. prepare deploys nothing.</text>
<text class="m i" x="36" y="409" font-size="11.5" text-anchor="start">wrangler secret put WORKER_MIGRATOR_TOKEN --config wrangler.migrate.jsonc</text>
<text class="m i" x="36" y="431" font-size="11.5" text-anchor="start">wrangler deploy --config wrangler.migrate.jsonc</text>
</svg>
